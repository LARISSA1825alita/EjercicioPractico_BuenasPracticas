<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Se eliminó cualquier referencia de versiones y puertos -->
    <title>Registro de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Se quitó código comentado del viejo diseño -->
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-lg mb-4">
            <div class="card-header bg-primary text-white">
                <!-- Se mantiene texto sin emojis -->
                <h2 class="mb-0">Registro de Usuarios</h2>
                <!-- Se eliminó la información de versiones -->
            </div>
            <div class="card-body">
                <form id="registroForm" method="POST" action="/usuarios" novalidate>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">Nombre(s)</label>
                            <input type="text" class="form-control" id="nombre" name="nombre"
                                   placeholder="Ingresa tu nombre" required maxlength="100" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+">
                            <!-- Se agregó validación -->
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="apellido1" class="form-label">Primer Apellido</label>
                            <input type="text" class="form-control" id="apellido1" name="apellido1"
                                   placeholder="Primer apellido" required maxlength="100" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+">
                            <!-- Se agregó validación-->
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="apellido2" class="form-label">Segundo Apellido</label>
                            <input type="text" class="form-control" id="apellido2" name="apellido2"
                                   placeholder="Segundo apellido" maxlength="100" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+">
                            <!-- Se agrego maxlength  -->
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" name="telefono"
                                   placeholder="10 dígitos" required pattern="[0-9]{10}">
                            <!-- Se cambió a type tel y se agregó patron y required -->
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="curp" class="form-label">CURP</label>
                            <input type="text" class="form-control" id="curp" name="curp"
                                   placeholder="18 caracteres" required maxlength="18" pattern="[A-Z]{4}[0-9]{6}[HM][A-Z]{5}[0-9]{2}">
                            <!-- Se agreg maxlength, pattern y required -->
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="ejemplo@correo.com" required>
                            <!-- Se cambió type a email y se agregó required -->
                        </div>
                    </div>

                    <!-- Se eliminó campo de contraseña comentado -->

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de registros -->
        <div class="mt-4">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Registros Guardados</h3>
                    <!-- Se eliminaron emojis -->
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th>Nombre Completo</th>
                                    <th>Teléfono</th>
                                    <th>CURP</th>
                                    <th>Correo</th>
                                </tr>
                            </thead>
                            <tbody id="tablaRegistros">
                                <!-- Contenedor limpio para registros -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
